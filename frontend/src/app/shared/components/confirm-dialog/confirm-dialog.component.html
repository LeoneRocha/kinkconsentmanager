<h2 mat-dialog-title class="confirm-dialog__title" [attr.title]="data.header">
  @if (data.icon) {
    <i
      [class]="data.icon"
      class="confirm-dialog__icon"
      [class.confirm-dialog__icon--danger]="data.danger"
      [attr.title]="data.header"
      aria-hidden="true"
    ></i>
  }
  <span>{{ data.header }}</span>
</h2>

<mat-dialog-content class="confirm-dialog__content">
  <p class="confirm-dialog__message" [attr.title]="data.message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="confirm-dialog__actions">
  @if (data.rejectLabel) {
    <button
      mat-stroked-button
      type="button"
      class="confirm-dialog__reject-btn"
      [attr.title]="data.rejectLabel"
      (click)="onReject()"
    >
      {{ data.rejectLabel }}
    </button>
  }
  <button
    mat-flat-button
    type="button"
    class="confirm-dialog__accept-btn"
    [class.confirm-dialog__accept-btn--danger]="data.danger"
    [attr.title]="data.acceptLabel"
    (click)="onAccept()"
  >
    {{ data.acceptLabel }}
  </button>
</mat-dialog-actions>
