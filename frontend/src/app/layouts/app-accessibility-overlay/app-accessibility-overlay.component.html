<div class="sr-only" role="status" aria-live="polite" aria-atomic="true">
  {{ accessibility.liveAnnouncement() }}
</div>

@if (accessibility.showCaptionBar()) {
  <aside
    class="app-shell__caption-bar"
    role="region"
    [attr.aria-label]="'a11yCaptionTitle' | schemaTranslate: 'ui'"
    [attr.title]="'a11yCaptionTitle' | schemaTranslate: 'ui'"
  >
    <div class="app-shell__caption-content">
      <span
        class="app-shell__caption-badge"
        [class.app-shell__caption-badge--pulse]="accessibility.isSpeaking()"
        [attr.title]="'a11yCaptionTitle' | schemaTranslate: 'ui'"
        aria-hidden="true"
      >
        <i
          class="fa-solid fa-volume-high"
          [attr.title]="'a11yCaptionTitle' | schemaTranslate: 'ui'"
        ></i>
      </span>
      <p class="app-shell__caption-text" [attr.title]="accessibility.liveAnnouncement()">
        {{ accessibility.liveAnnouncement() }}
      </p>
    </div>

    <div class="app-shell__caption-actions">
      @if (accessibility.isSpeaking()) {
        <button
          type="button"
          class="app-shell__caption-btn"
          [attr.aria-label]="'a11yStopReading' | schemaTranslate: 'ui'"
          [attr.title]="'a11yStopReading' | schemaTranslate: 'ui'"
          (click)="accessibility.stopSpeaking()"
        >
          <i
            class="fa-solid fa-stop"
            [attr.title]="'a11yStopReading' | schemaTranslate: 'ui'"
            aria-hidden="true"
          ></i>
        </button>
      }
      <button
        type="button"
        class="app-shell__caption-btn"
        [attr.aria-label]="'a11yCaptionDismiss' | schemaTranslate: 'ui'"
        [attr.title]="'a11yCaptionDismiss' | schemaTranslate: 'ui'"
        (click)="accessibility.dismissCaption()"
      >
        <i
          class="fa-solid fa-xmark"
          [attr.title]="'a11yCaptionDismiss' | schemaTranslate: 'ui'"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </aside>
}
