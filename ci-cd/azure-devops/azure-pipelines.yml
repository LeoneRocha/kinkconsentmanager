# ==============================================================================
# KinkConsentManager UI — Pipeline Multiestágio de CI/CD (Azure DevOps)
# ==============================================================================
# ESTADO ATUAL: DESATIVADO POR PADRÃO
# - `trigger: none` e `pr: none` garantem zero execução automática até ativação.
# - Os estágios de CD (Docker e Azure Deploy) também ficam desativados por padrão
#   via parâmetros booleanos (`false`) e protegidos por branch `refs/heads/main`
#   e Environment `production` com aprovação manual obrigatória.
#
# COMO ATIVAR NO FUTURO:
# 1. Cadastre este arquivo no Azure DevOps Pipelines apontando para:
#    `ci-cd/azure-devops/azure-pipelines.yml`
# 2. Configure o Variable Group `kinkconsentmanager-ci-vars` (ou variáveis de pipeline)
#    e as Service Connections descritas em `ci-cd/README.md`.
# 3. Crie o Environment `production` no Azure DevOps com:
#    - Approvals and checks -> Approvals (aprovadores obrigatórios)
#    - Approvals and checks -> Branch control -> `refs/heads/main`
# 4. Quando quiser automatizar na branch única (`main`), descomente o bloco `trigger`
#    abaixo e remova `trigger: none`.
# ==============================================================================

trigger: none
pr: none

# Para ativar CI automático na branch única `main`, substitua as linhas acima por:
# trigger:
#   branches:
#     include:
#       - main
#   paths:
#     include:
#       - frontend/**
#       - ci-cd/**
#     exclude:
#       - docs/**
#       - '**/*.md'

parameters:
  - name: nodeVersion
    displayName: 'Versão do Node.js'
    type: string
    default: '24.x'

  - name: enableSonarCloud
    displayName: 'Executar análise e Quality Gate no SonarCloud'
    type: boolean
    default: true

  - name: enableSnykScan
    displayName: 'Executar Snyk Security Scan (requer extensão/conexão Snyk)'
    type: boolean
    default: false

  - name: enableDockerPublish
    displayName: 'Executar estágio CD — Build & Push da imagem Docker (somente main)'
    type: boolean
    default: false

  - name: enableAzureDeploy
    displayName: 'Executar estágio CD — Deploy no Azure Web App com aprovação (somente main)'
    type: boolean
    default: false

variables:
  - group: kinkconsentmanager-ci-vars
  - name: frontendDir
    value: '$(Build.SourcesDirectory)/frontend'
  - name: distBrowserDir
    value: '$(Build.SourcesDirectory)/frontend/dist/kinkconsentmanager/browser'
  - name: npmCacheFolder
    value: '$(Pipeline.Workspace)/.npm'
  # Fallback caso não definidos no Variable Group `kinkconsentmanager-ci-vars`:
  - name: sonarOrganization
    value: 'lionscorp'
  - name: azureWebAppName
    value: 'kinkconsentmanagerapp'
  - name: azureStartupCommand
    value: 'pm2 serve /home/site/wwwroot --no-daemon --spa'
  - name: dockerImageRepository
    value: 'leonecr/kinkconsentmanager-ui'

stages:
  # ============================================================================
  # ESTÁGIO 1 — CI: Build, Segurança, Testes Jest, Cobertura e SonarCloud
  # ============================================================================
  - stage: CI_Build_Quality
    displayName: 'CI — Build, Testes, Cobertura & SonarCloud'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: BuildAndTestFrontend
        displayName: 'Build Angular 22, Jest & SonarCloud'
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true
            displayName: 'Checkout completo (fetchDepth: 0 para SonarCloud)'

          - task: NodeTool@0
            displayName: 'Instalar Node.js ${{ parameters.nodeVersion }}'
            inputs:
              versionSpec: '${{ parameters.nodeVersion }}'

          - task: Cache@2
            displayName: 'Cache de pacotes npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(npmCacheFolder)'

          - task: Npm@1
            displayName: 'npm ci (instalação determinística em frontend/)'
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'ci --cache $(npmCacheFolder) --prefer-offline'

          - task: CmdLine@2
            displayName: 'Auditoria de dependências npm (aviso high/critical)'
            continueOnError: true
            inputs:
              workingDirectory: '$(frontendDir)'
              script: |
                npm audit --audit-level=high --omit=dev

          - ${{ if eq(parameters.enableSnykScan, true) }}:
              - task: SnykSecurityScan@1
                displayName: 'Snyk Scan de vulnerabilidades Open Source'
                inputs:
                  serviceConnectionEndpoint: '$(snykServiceConnection)'
                  testType: 'app'
                  targetFile: '$(frontendDir)/package.json'
                  additionalArguments: '--severity-threshold=high'
                  failOnIssues: false

          - ${{ if eq(parameters.enableSonarCloud, true) }}:
              - task: SonarCloudPrepare@3
                displayName: 'SonarCloud — Preparar análise (CLI)'
                inputs:
                  SonarCloud: '$(sonarCloudServiceConnection)'
                  organization: '$(sonarOrganization)'
                  scannerMode: 'CLI'
                  configMode: 'file'
                  configFile: 'frontend/sonar-project.properties'

          - task: Npm@1
            displayName: 'Build de produção Angular (build:prod)'
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'run build:prod'

          - task: Npm@1
            displayName: 'Testes unitários e cobertura Jest (test:ci)'
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'run test:ci'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados JUnit dos testes Jest'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'frontend/coverage/junit/test-results.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: 'Jest Unit Tests — KinkConsentManager UI'
              failTaskOnFailedTests: true

          - task: ReportGenerator@5
            displayName: 'Gerar relatório consolidado de cobertura (Cobertura + HTML)'
            condition: succeededOrFailed()
            inputs:
              reports: '$(frontendDir)/coverage/cobertura-coverage.xml'
              targetdir: '$(frontendDir)/coverage/reportgenerator'
              reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura no Azure Pipelines (Cobertura XML)'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(frontendDir)/coverage/cobertura-coverage.xml'
              pathToSources: '$(frontendDir)/src'
              failIfCoverageEmpty: true

          - ${{ if eq(parameters.enableSonarCloud, true) }}:
              - task: SonarCloudAnalyze@3
                displayName: 'SonarCloud — Executar análise de código e cobertura'

              - task: SonarCloudPublish@3
                displayName: 'SonarCloud — Publicar Quality Gate'
                inputs:
                  pollingTimeoutSec: '300'

          - task: CmdLine@2
            displayName: 'Validar saída SPA em dist/kinkconsentmanager/browser'
            inputs:
              script: |
                test -f "$(distBrowserDir)/index.html" || { echo "ERRO: index.html não encontrado em $(distBrowserDir)"; exit 1; }
                ls -lh "$(distBrowserDir)"

          - task: ArchiveFiles@2
            displayName: 'Compactar pacote SPA para Azure Web App (.zip)'
            inputs:
              rootFolderOrFile: '$(distBrowserDir)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/webapp/kinkconsentmanager-ui-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: CopyFiles@2
            displayName: 'Copiar dockercompose.prod.yml para artefato'
            inputs:
              SourceFolder: '$(frontendDir)'
              Contents: 'dockercompose.prod.yml'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/docker-compose'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato WebApp (drop-webapp)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/webapp'
              artifact: 'drop-webapp'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato Docker Compose (drop-docker-compose)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/docker-compose'
              artifact: 'drop-docker-compose'
              publishLocation: 'pipeline'

  # ============================================================================
  # ESTÁGIO 2 — CD: Build, Smoke Test e Push da Imagem Docker (separado)
  # ============================================================================
  - stage: CD_Docker_Image
    displayName: 'CD — Build, Smoke Test & Push Docker Image'
    dependsOn: CI_Build_Quality
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.enableDockerPublish }}', true),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: BuildAndPushDocker
        displayName: 'Docker Build (Nginx SPA), Healthcheck & Push'
        steps:
          - checkout: self
            clean: true

          - task: Docker@2
            displayName: 'Docker Build da imagem $(dockerImageRepository)'
            inputs:
              command: 'build'
              Dockerfile: '$(frontendDir)/Dockerfile'
              buildContext: '$(frontendDir)'
              repository: '$(dockerImageRepository)'
              tags: |
                $(Build.BuildId)
                latest

          - task: CmdLine@2
            displayName: 'Smoke test do container Nginx (/health e SPA)'
            inputs:
              script: |
                set -euo pipefail
                docker run -d --name kcm-smoke -p 18080:80 "$(dockerImageRepository):$(Build.BuildId)"
                trap 'docker rm -f kcm-smoke >/dev/null 2>&1 || true' EXIT
                sleep 3
                curl -fsS http://127.0.0.1:18080/health
                curl -fsS -o /dev/null http://127.0.0.1:18080/

          - task: Docker@2
            displayName: 'Docker Push para Container Registry'
            inputs:
              command: 'push'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(dockerImageRepository)'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================================================
  # ESTÁGIO 3 — CD: Deploy no Azure Web App Linux (Aprovação + Branch main)
  # ============================================================================
  - stage: CD_Deploy_Azure
    displayName: 'CD — Deploy Azure Web App (com Aprovação)'
    dependsOn: CI_Build_Quality
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.enableAzureDeploy }}', true),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - deployment: DeployAzureWebApp
        displayName: 'Deploy SPA para Azure Web App ($(azureWebAppName))'
        # Configurar no Environment `production` do Azure DevOps:
        # 1) Approvals -> Aprovadores obrigatórios antes do deploy
        # 2) Branch control -> Permitir apenas refs/heads/main
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'drop-webapp'
                  displayName: 'Baixar pacote ZIP do frontend'

                - task: AzureWebApp@1
                  displayName: 'Deploy no Azure Web App Linux ($(azureWebAppName))'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(azureWebAppName)'
                    package: '$(Pipeline.Workspace)/drop-webapp/kinkconsentmanager-ui-$(Build.BuildId).zip'
                    runtimeStack: 'NODE|24-lts'
                    startUpCommand: '$(azureStartupCommand)'

                - task: CmdLine@2
                  displayName: 'Smoke test pós-deploy HTTPS'
                  continueOnError: true
                  inputs:
                    script: |
                      URL="${AZURE_WEBAPP_URL:-https://$(azureWebAppName).azurewebsites.net}"
                      echo "Verificando disponibilidade em $URL ..."
                      curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$URL"
