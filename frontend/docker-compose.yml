name: kinkconsentmanager-ui

services:
  # Servico principal (Nginx de producao em http://localhost:8082)
  # Uso: docker compose up --build
  kinkconsentmanager-ui:
    image: leonecr/kinkconsentmanager-ui:latest
    container_name: kinkconsentmanager_ui_container
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Servico opcional para desenvolvimento com hot-reload (http://localhost:4200)
  # Uso: docker compose --profile dev up
  kinkconsentmanager-ui-dev:
    profiles:
      - dev
    container_name: kinkconsentmanager_ui_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "4200:4200"
    volumes:
      - .:/app/frontend
      - /app/frontend/node_modules
    restart: unless-stopped
