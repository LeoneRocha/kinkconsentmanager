@if (worker.isProcessing()) {
  <div
    class="import-overlay"
    role="status"
    aria-live="polite"
    [attr.aria-busy]="!worker.isCompleted()"
    [attr.aria-label]="titleText()"
    [attr.title]="titleText()"
  >
    <div
      class="import-overlay__card"
      [class.import-overlay__card--completed]="worker.isCompleted()"
    >
      <div class="import-overlay__orbit" aria-hidden="true">
        <span
          class="import-overlay__ring"
          [class.import-overlay__ring--completed]="worker.isCompleted()"
        ></span>
        <span
          class="import-overlay__core"
          [class.import-overlay__core--completed]="worker.isCompleted()"
        >
          <i [class]="coreIconClass()" [attr.title]="titleText()"></i>
        </span>
      </div>

      <h2 class="import-overlay__title" [attr.title]="titleText()">{{ titleText() }}</h2>
      <p class="import-overlay__stage" [attr.title]="stageText()">{{ stageText() }}</p>

      @if (worker.fileName(); as fileName) {
        <div class="import-overlay__file-pill" [attr.title]="fileName">
          <i [class]="fileIconClass()" [attr.title]="fileName" aria-hidden="true"></i>
          <span class="import-overlay__file-name">{{ fileName }}</span>
        </div>
      }

      <div class="import-overlay__progress-wrap">
        <div
          class="import-overlay__progress-track"
          role="progressbar"
          [attr.aria-valuenow]="worker.progress()"
          [attr.aria-label]="titleText()"
          [attr.title]="titleText() + ' (' + worker.progress() + '%)'"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div
            class="import-overlay__progress-fill"
            [class.import-overlay__progress-fill--completed]="worker.isCompleted()"
            [style.width.%]="worker.progress()"
          ></div>
        </div>
        <span class="import-overlay__progress-pct" [attr.title]="worker.progress() + '%'"
          >{{ worker.progress() }}%</span
        >
      </div>

      <div class="import-overlay__badge" [attr.title]="backgroundBadgeText()">
        <i
          class="fa-solid fa-shield-halved"
          [attr.title]="backgroundBadgeText()"
          aria-hidden="true"
        ></i>
        <span>{{ backgroundBadgeText() }}</span>
      </div>
    </div>
  </div>
}
