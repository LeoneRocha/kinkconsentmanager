# ==============================================================================
# KinkConsentManager (Frontend + Backend) — Pipeline Multiestágio de CI/CD (GitHub Actions)
# ==============================================================================
# ESTADO ATUAL: DESATIVADO PARA EXECUÇÕES AUTOMÁTICAS (CD / DOCKER DESATIVADOS POR PADRÃO)
# - Mantido em `ci-cd/github/` e espelhado em `.github/workflows/`, configurado
#   com `workflow_dispatch` (execução manual).
# - Os estágios de CD (Docker Frontend, Docker Backend e Azure Deploy) exigem flag
#   explícita (`true`), execução na branch `main` e aprovação humana configurada
#   no Environment `production` do GitHub.
#
# ATENÇÃO SOBRE WORKFLOW EXISTENTE:
# - Caso exista `.github/workflows/main_kinkconsentmanagerapp.yml` gerado pelo
#   Azure QuickDeploy, revise ou substitua-o para evitar deploys duplicados.
#
# COMO ATIVAR NO FUTURO:
# 1. Mantenha este arquivo sincronizado com `.github/workflows/kinkconsentmanager-ci-cd.yml`.
# 2. Configure Secrets/Variables e o Environment `production` no repositório
#    com "Required reviewers" e "Deployment branches -> main" (ver `ci-cd/README.md`).
# 3. Quando desejar CI automático, descomente os blocos `push` e `pull_request`.
# ==============================================================================

name: KinkConsentManager CI/CD

on:
  workflow_dispatch:
    inputs:
      run_sonarcloud:
        description: 'Executar análise e Quality Gate no SonarCloud'
        type: boolean
        required: true
        default: true
      run_docker_publish:
        description: 'Executar estágio CD — Build & Push da imagem Docker Frontend (somente main)'
        type: boolean
        required: false
        default: false
      run_backend_docker_publish:
        description: 'Executar estágio CD — Build & Push da imagem Docker Backend (somente main)'
        type: boolean
        required: false
        default: false
      run_azure_deploy:
        description: 'Executar estágio CD — Deploy no Azure Web App com aprovação (somente main)'
        type: boolean
        required: false
        default: false

  # Para habilitar CI automático em commits/PRs para a branch única `main`:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'frontend/**'
  #     - 'backend/**'
  #     - 'ci-cd/**'
  #     - '.github/workflows/kinkconsentmanager-ci-cd.yml'
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - 'frontend/**'
  #     - 'backend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DOTNET_VERSION: '10.0.x'
  FRONTEND_DIR: 'frontend'
  DIST_BROWSER_DIR: 'frontend/dist/kinkconsentmanager/browser'
  BACKEND_DIR: 'backend'
  BACKEND_SLN: 'backend/KinkConsentManager.sln'
  BACKEND_API_PROJECT: 'backend/APIs/KinkConsentManager.API/KinkConsentManager.API.csproj'

jobs:
  # ============================================================================
  # ESTÁGIO 1A — CI Frontend: Build, Segurança, Testes Jest, Cobertura e SonarCloud
  # ============================================================================
  ci_build_quality:
    name: 'CI Frontend — Build, Testes, Cobertura & SonarCloud'
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout completo do repositório (fetch-depth 0 para SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js ${{ env.NODE_VERSION }} com cache npm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependências (npm ci)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Auditoria de vulnerabilidades npm (high/critical)
        working-directory: ${{ env.FRONTEND_DIR }}
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: Snyk Security Scan (opcional se SNYK_TOKEN estiver configurado)
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=frontend/package.json --severity-threshold=high

      - name: Build de produção Angular (build:prod)
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          BUILD_ID: ${{ github.run_number }}
        run: npm run build:prod

      - name: Executar testes unitários e cobertura Jest (test:ci)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:ci

      - name: Validar artefatos de cobertura e bundle SPA
        run: |
          test -f "${{ env.FRONTEND_DIR }}/coverage/junit/test-results.xml"
          test -f "${{ env.FRONTEND_DIR }}/coverage/cobertura-coverage.xml"
          test -f "${{ env.FRONTEND_DIR }}/coverage/lcov.info"
          test -f "${{ env.FRONTEND_DIR }}/coverage/sonar/sonar-report.xml"
          test -f "${{ env.DIST_BROWSER_DIR }}/index.html"

      - name: Publicar resumo de testes Jest (JUnit) no PR / Workflow
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Jest Unit Tests (KinkConsentManager UI)
          path: frontend/coverage/junit/test-results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Análise & Quality Gate no SonarCloud
        if: ${{ (inputs.run_sonarcloud == true || github.event_name != 'workflow_dispatch') && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=frontend/sonar-project.properties

      - name: Aguardar Quality Gate do SonarCloud
        if: ${{ (inputs.run_sonarcloud == true || github.event_name != 'workflow_dispatch') && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload do artefato SPA para Deploy (webapp-dist)
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: ${{ env.DIST_BROWSER_DIR }}/
          retention-days: 14

      - name: Upload dos relatórios de testes e cobertura (Jest / Cobertura / LCOV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-reports
          path: |
            frontend/coverage/cobertura-coverage.xml
            frontend/coverage/lcov.info
            frontend/coverage/junit/test-results.xml
            frontend/coverage/sonar/sonar-report.xml
          retention-days: 14

      - name: Upload de dockercompose.prod.yml
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-prod
          path: frontend/dockercompose.prod.yml
          retention-days: 14

  # ============================================================================
  # ESTÁGIO 1B — CI Backend: Build .NET 10, Testes NUnit & Cobertura
  # ============================================================================
  ci_backend_build_test:
    name: 'CI Backend — Build, Testes NUnit & Cobertura'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET SDK ${{ env.DOTNET_VERSION }} com cache NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: 'backend/Directory.Packages.props'

      - name: Restore da Solution Backend (KinkConsentManager.sln)
        run: dotnet restore "${{ env.BACKEND_SLN }}"

      - name: Build Release da Solution Backend
        run: dotnet build "${{ env.BACKEND_SLN }}" -c Release --no-restore

      - name: Executar testes NUnit e cobertura do Backend
        run: |
          dotnet test "${{ env.BACKEND_SLN }}" -c Release --no-build \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory "${{ env.BACKEND_DIR }}/TestResults" \
            --collect:"XPlat Code Coverage"

      - name: Validar relatórios TRX e Cobertura XML gerados
        run: |
          set -euo pipefail
          TRX_COUNT=$(find "${{ env.BACKEND_DIR }}/TestResults" -name '*.trx' | wc -l)
          COV_COUNT=$(find "${{ env.BACKEND_DIR }}/TestResults" -name 'coverage.cobertura.xml' | wc -l)
          echo "Arquivos TRX: ${TRX_COUNT} | Arquivos Cobertura: ${COV_COUNT}"
          test "${TRX_COUNT}" -ge 1
          test "${COV_COUNT}" -ge 1

      - name: Publicar resumo de testes NUnit (TRX) no PR / Workflow
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: NUnit Tests (KinkConsentManager Backend)
          path: backend/TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Publish Release da API Backend
        run: dotnet publish "${{ env.BACKEND_API_PROJECT }}" -c Release --no-build -o "${{ env.BACKEND_DIR }}/publish/api"

      - name: Upload do artefato publicado da API Backend (backend-api-dist)
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-dist
          path: backend/publish/api/
          retention-days: 14

      - name: Upload dos relatórios de testes e cobertura do Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: backend/TestResults/
          retention-days: 14

      - name: Upload de docker-compose.prod.yml do Backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-compose-prod
          path: backend/APIs/KinkConsentManager.API/docker-compose.prod.yml
          retention-days: 14

  # ============================================================================
  # ESTÁGIO 2A — CD Frontend: Build, Smoke Test e Push da Imagem Docker (desativado por padrão)
  # ============================================================================
  cd_docker_image:
    name: 'CD Frontend — Build, Smoke Test & Push Docker Image'
    needs: ci_build_quality
    if: ${{ github.ref == 'refs/heads/main' && inputs.run_docker_publish == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local da imagem Docker para smoke test
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: ${{ vars.DOCKER_IMAGE || 'leonecr/kinkconsentmanager-ui' }}:smoke
          build-args: BUILD_ID=${{ github.run_number }}

      - name: Smoke test do container Nginx (/health e SPA)
        run: |
          set -euo pipefail
          IMAGE="${{ vars.DOCKER_IMAGE || 'leonecr/kinkconsentmanager-ui' }}:smoke"
          docker run -d --name kcm-smoke -p 18080:80 "$IMAGE"
          trap 'docker rm -f kcm-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS -o /dev/null http://127.0.0.1:18080/

      - name: Login no Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem Docker (tag SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE || 'leonecr/kinkconsentmanager-ui' }}:${{ github.sha }}
            ${{ vars.DOCKER_IMAGE || 'leonecr/kinkconsentmanager-ui' }}:latest
          build-args: BUILD_ID=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # ESTÁGIO 2B — CD Backend: Build, Smoke Test e Push da Imagem Docker (desativado por padrão)
  # ============================================================================
  cd_backend_docker_image:
    name: 'CD Backend — Build, Smoke Test & Push Docker Image'
    needs: ci_backend_build_test
    if: ${{ github.ref == 'refs/heads/main' && inputs.run_backend_docker_publish == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local da imagem Docker Backend para smoke test
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/APIs/KinkConsentManager.API/Dockerfile
          load: true
          tags: ${{ vars.BACKEND_DOCKER_IMAGE || 'leonecr/kinkconsentmanager-api' }}:smoke

      - name: Smoke test do container Backend (/health)
        run: |
          set -euo pipefail
          IMAGE="${{ vars.BACKEND_DOCKER_IMAGE || 'leonecr/kinkconsentmanager-api' }}:smoke"
          docker run -d --name kcm-api-smoke -p 18081:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e DatabaseProvider=InMemory \
            -e Database__SkipInitialization=true \
            -e TokenConfigurations__Secret=KinkConsentManagerCiSmokeTestSecretKeyOnlyForValidation2026_1234567890 \
            "$IMAGE"
          trap 'docker rm -f kcm-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18081/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs kcm-api-smoke || true
          exit 1

      - name: Login no Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem Docker Backend (tag SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/APIs/KinkConsentManager.API/Dockerfile
          push: true
          tags: |
            ${{ vars.BACKEND_DOCKER_IMAGE || 'leonecr/kinkconsentmanager-api' }}:${{ github.sha }}
            ${{ vars.BACKEND_DOCKER_IMAGE || 'leonecr/kinkconsentmanager-api' }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # ESTÁGIO 3 — CD: Deploy no Azure Web App Linux (Aprovação + Branch main)
  # ============================================================================
  cd_deploy_azure:
    name: 'CD — Deploy Azure Web App (com Aprovação)'
    needs: ci_build_quality
    if: ${{ github.ref == 'refs/heads/main' && inputs.run_azure_deploy == true }}
    runs-on: ubuntu-latest
    # Environment `production` no GitHub Settings -> Environments:
    # - Habilitar "Required reviewers" (aprovação manual obrigatória)
    # - Habilitar "Deployment branches and tags" -> apenas `main`
    environment:
      name: production
      url: ${{ vars.AZURE_WEBAPP_URL || 'https://kinkconsentmanagerapp.azurewebsites.net' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artefato SPA compilado (webapp-dist)
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: ./webapp-dist

      - name: Autenticar no Azure via OIDC (sem credenciais hardcoded)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy no Azure Web App Linux (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'kinkconsentmanagerapp' }}
          slot-name: 'Production'
          package: ./webapp-dist

      - name: Smoke test pós-deploy
        continue-on-error: true
        run: |
          URL="${{ vars.AZURE_WEBAPP_URL || 'https://kinkconsentmanagerapp.azurewebsites.net' }}"
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$URL"

      - name: Encerrar sessão Azure CLI
        if: always()
        run: az logout || true
