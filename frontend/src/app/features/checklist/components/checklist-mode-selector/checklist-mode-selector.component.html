<section class="mode-selector" [attr.aria-label]="labels().pageTitle">
  <header class="mode-selector__hero">
    <div class="mode-selector__hero-copy">
      <h1 class="mode-selector__title" [attr.title]="labels().pageTitle">
        {{ labels().pageTitle }}
      </h1>
      <p class="mode-selector__subtitle" [attr.title]="labels().pageSubtitle">
        {{ labels().pageSubtitle }}
      </p>
    </div>

    @if (hasSavedProgress()) {
      <div class="mode-selector__hero-meta">
        <div
          class="mode-selector__saved-banner"
          role="status"
          [attr.title]="
            labels().existingProgressLabel +
            ': ' +
            answeredCount() +
            ' / ' +
            totalCount() +
            ' (' +
            progressPercentage() +
            '%)'
          "
        >
          <i
            class="fa-solid fa-clock-rotate-left"
            [attr.title]="labels().existingProgressLabel"
            aria-hidden="true"
          ></i>
          <span>
            {{ labels().existingProgressLabel }}:
            <strong
              >{{ answeredCount() }} / {{ totalCount() }} ({{ progressPercentage() }}%)</strong
            >
          </span>
        </div>
      </div>
    }
  </header>

  <div class="mode-selector__grid">
    @for (card of modeCards(); track card.mode) {
      <button
        type="button"
        class="mode-selector__card"
        [attr.data-start-mode]="card.mode"
        [attr.aria-label]="card.title + ' — ' + card.description"
        [attr.title]="card.title + ' (' + card.badge + ') — ' + card.description"
        (click)="onSelectMode(card.mode)"
      >
        <div class="mode-selector__card-top">
          <span class="mode-selector__icon" aria-hidden="true">
            <i [class]="card.icon" [attr.title]="card.title"></i>
          </span>
          <div class="mode-selector__title-wrap">
            <h2 class="mode-selector__card-title" [attr.title]="card.title">{{ card.title }}</h2>
            <span class="mode-selector__badge" [attr.title]="card.badge">{{ card.badge }}</span>
          </div>
        </div>

        <p class="mode-selector__desc" [attr.title]="card.description">{{ card.description }}</p>

        <div class="mode-selector__howto">
          <span class="mode-selector__howto-label" [attr.title]="labels().howToFillLabel">
            <i
              class="fa-solid fa-circle-info"
              [attr.title]="labels().howToFillLabel"
              aria-hidden="true"
            ></i>
            <span>{{ labels().howToFillLabel }}</span>
          </span>
          <p class="mode-selector__howto-text" [attr.title]="card.howToFill">
            {{ card.howToFill }}
          </p>
        </div>

        <span
          class="mode-selector__cta"
          [attr.title]="hasSavedProgress() ? labels().continueButton : labels().startButton"
        >
          <span>{{ hasSavedProgress() ? labels().continueButton : labels().startButton }}</span>
          <i
            class="fa-solid fa-arrow-right"
            [attr.title]="hasSavedProgress() ? labels().continueButton : labels().startButton"
            aria-hidden="true"
          ></i>
        </span>
      </button>
    }
  </div>

  <div class="mode-selector__import-card">
    <div class="mode-selector__import-copy">
      <span class="mode-selector__import-icon" aria-hidden="true">
        <i class="fa-solid fa-file-import" [attr.title]="labels().importTitle"></i>
      </span>
      <div class="mode-selector__import-text">
        <h2 class="mode-selector__import-title" [attr.title]="labels().importTitle">
          {{ labels().importTitle }}
        </h2>
        <p class="mode-selector__import-desc" [attr.title]="labels().importDesc">
          {{ labels().importDesc }}
        </p>
      </div>
    </div>

    <div class="mode-selector__import-actions">
      <button
        mat-stroked-button
        type="button"
        class="mode-selector__import-btn"
        data-action="import-json"
        [disabled]="isImporting()"
        [attr.title]="labels().importButton"
        [attr.aria-label]="labels().importButton"
        (click)="onImportTriggerClick()"
      >
        <i
          [class]="isImporting() ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-upload'"
          [attr.title]="labels().importButton"
          aria-hidden="true"
        ></i>
        <span>{{ labels().importButton }}</span>
      </button>

      <input
        #jsonFileInput
        type="file"
        accept=".json,application/json"
        class="mode-selector__file-input"
        tabindex="-1"
        [attr.aria-label]="labels().importButton"
        [attr.title]="labels().importButton"
        (change)="onFileSelected($event)"
      />
    </div>
  </div>
</section>
