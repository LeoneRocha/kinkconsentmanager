  <path d="M 13.5 52.2 C 13.5 41.6, 20.2 36.2, 29 36.2 C 37.8 36.2, 44.5 41.6, 44.5 52.2 C 44.5 53.9, 43.2 55.2, 41.5 55.2 L 16.5 55.2 C 14.8 55.2, 13.5 53.9, 13.5 52.2 Z" fill="url(#kcm-crimson)" />
</svg>
