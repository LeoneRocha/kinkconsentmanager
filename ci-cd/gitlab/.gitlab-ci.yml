# ==============================================================================
# KinkConsentManager (Frontend + Backend) — Pipeline Multiestágio de CI/CD (GitLab CI/CD)
# ==============================================================================
# ESTADO ATUAL: DESATIVADO POR PADRÃO (DOCKER FRONTEND E BACKEND DESATIVADOS)
# - `PIPELINE_ENABLED: "false"` impede qualquer disparo automático.
# - Para utilizar no GitLab, crie/referencie `.gitlab-ci.yml` na raiz apontando
#   para este arquivo (`include: local: '/ci-cd/gitlab/.gitlab-ci.yml'`) e ajuste
#   `PIPELINE_ENABLED: "true"` quando desejar ativar.
# - Os estágios Docker (`ENABLE_DOCKER_PUBLISH`, `ENABLE_BACKEND_DOCKER_PUBLISH`) e
#   Deploy Azure (`ENABLE_AZURE_DEPLOY`) permanecem `"false"` por padrão.
# ==============================================================================

variables:
  PIPELINE_ENABLED: "false"
  ENABLE_SONARCLOUD: "true"
  ENABLE_DOCKER_PUBLISH: "false"
  ENABLE_BACKEND_DOCKER_PUBLISH: "false"
  ENABLE_AZURE_DEPLOY: "false"
  ENABLE_BACKEND_AZURE_DEPLOY: "false"
  FRONTEND_DIR: "frontend"
  DIST_BROWSER_DIR: "frontend/dist/kinkconsentmanager/browser"
  BACKEND_DIR: "backend"
  AZURE_WEBAPP_NAME: "kinkconsentmanagerapp"
  AZURE_BACKEND_WEBAPP_NAME: "kinkconsentmanagerapi"
  AZURE_RESOURCE_GROUP: "kinkconsentmanagerrg"
  DOCKER_IMAGE: "leonecr/kinkconsentmanager-ui"
  BACKEND_DOCKER_IMAGE: "leonecr/kinkconsentmanager-api"
  GIT_DEPTH: "0"

workflow:
  rules:
    - if: '$PIPELINE_ENABLED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - build_test
  - quality_security
  - docker_image
  - deploy_azure

# ==============================================================================
# ESTÁGIO 1A — Build Angular, Testes Jest, JUnit e Cobertura XML
# ==============================================================================
ci_build_and_test:
  stage: build_test
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd "$FRONTEND_DIR"
    - npm ci --cache .npm --prefer-offline
    - npm run build:prod
    - npm run test:ci
    - test -f coverage/junit/test-results.xml
    - test -f coverage/cobertura-coverage.xml
    - test -f coverage/lcov.info
    - test -f coverage/sonar/sonar-report.xml
    - test -f dist/kinkconsentmanager/browser/index.html
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/dist/kinkconsentmanager/browser/
      - frontend/coverage/
      - frontend/dockercompose.prod.yml
    reports:
      junit: frontend/coverage/junit/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# ==============================================================================
# ESTÁGIO 1B — Build Backend .NET 10, Testes NUnit & Cobertura XML
# ==============================================================================
ci_backend_build_and_test:
  stage: build_test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    NUGET_PACKAGES: "${CI_PROJECT_DIR}/backend/.nuget/packages"
  cache:
    key:
      files:
        - backend/Directory.Packages.props
    paths:
      - backend/.nuget/packages/
  script:
    - cd "$BACKEND_DIR"
    - dotnet restore KinkConsentManager.sln
    - dotnet build KinkConsentManager.sln -c Release --no-restore
    - dotnet test KinkConsentManager.sln -c Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults --collect:"XPlat Code Coverage"
    - test "$(find TestResults -name '*.trx' | wc -l)" -ge 1
    - test "$(find TestResults -name 'coverage.cobertura.xml' | wc -l)" -ge 1
    - dotnet publish APIs/KinkConsentManager.API/KinkConsentManager.API.csproj -c Release --no-build /p:UseAppHost=false -o publish/api
    - test -f publish/api/KinkConsentManager.API.dll
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - backend/publish/api/
      - backend/TestResults/
      - backend/APIs/KinkConsentManager.API/docker-compose.prod.yml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/TestResults/*/coverage.cobertura.xml

# ==============================================================================
# ESTÁGIO 2 — SonarCloud & Auditoria de Dependências
# ==============================================================================
ci_npm_audit:
  stage: quality_security
  image: node:24-alpine
  needs: []
  allow_failure: true
  script:
    - cd "$FRONTEND_DIR"
    - npm ci --ignore-scripts
    - npm audit --audit-level=high --omit=dev

ci_sonarcloud:
  stage: quality_security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - ci_build_and_test
  rules:
    - if: '$ENABLE_SONARCLOUD == "true" && $SONAR_TOKEN'
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dproject.settings=frontend/sonar-project.properties -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=true

# ==============================================================================
# ESTÁGIO 3A — CD Frontend: Build, Smoke Test & Push da Imagem Docker (desativado por padrão)
# ==============================================================================
cd_docker_build_push:
  stage: docker_image
  image: docker:27-cli
  services:
    - docker:27-dind
  needs:
    - job: ci_build_and_test
    - job: ci_sonarcloud
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_DOCKER_PUBLISH == "true"'
      when: on_success
    - when: never
  script:
    - docker build --build-arg BUILD_ID="$CI_PIPELINE_IID" -f frontend/Dockerfile -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$DOCKER_IMAGE:latest" frontend
    - docker run -d --name kcm-smoke -p 18080:80 "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 3
    - wget -q -O- http://docker:18080/health || wget -q -O- http://127.0.0.1:18080/health
    - docker rm -f kcm-smoke
    - echo "$DOCKER_PASSWORD" | docker login "${DOCKER_REGISTRY:-docker.io}" -u "$DOCKER_USERNAME" --password-stdin
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKER_IMAGE:latest"

# ==============================================================================
# ESTÁGIO 3B — CD Backend: Build, Smoke Test & Push da Imagem Docker (desativado por padrão)
# ==============================================================================
cd_backend_docker_build_push:
  stage: docker_image
  image: docker:27-cli
  services:
    - docker:27-dind
  needs:
    - ci_backend_build_and_test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_BACKEND_DOCKER_PUBLISH == "true"'
      when: on_success
    - when: never
  script:
    - docker build -f backend/APIs/KinkConsentManager.API/Dockerfile -t "$BACKEND_DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_DOCKER_IMAGE:latest" backend
    - docker run -d --name kcm-api-smoke -p 18081:8080 -e ASPNETCORE_ENVIRONMENT=Development -e DatabaseProvider=InMemory -e Database__SkipInitialization=true -e TokenConfigurations__Secret=KinkConsentManagerCiSmokeTestSecretKeyOnlyForValidation2026_1234567890 "$BACKEND_DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - wget -q -O- http://docker:18081/health || wget -q -O- http://127.0.0.1:18081/health
    - docker rm -f kcm-api-smoke
    - echo "$DOCKER_PASSWORD" | docker login "${DOCKER_REGISTRY:-docker.io}" -u "$DOCKER_USERNAME" --password-stdin
    - docker push "$BACKEND_DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_DOCKER_IMAGE:latest"

# ==============================================================================
# ESTÁGIO 4 — CD: Deploy no Azure Web App Linux (Aprovação Manual + main)
# ==============================================================================
cd_deploy_azure_webapp:
  stage: deploy_azure
  image: mcr.microsoft.com/azure-cli:latest
  needs:
    - job: ci_build_and_test
    - job: ci_sonarcloud
      optional: true
  environment:
    name: production
    url: https://kinkconsentmanagerapp.azurewebsites.net
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_AZURE_DEPLOY == "true"'
      when: manual
    - when: never
  script:
    - apk add --no-cache zip curl
    - cd "$DIST_BROWSER_DIR"
    - zip -r "${CI_PROJECT_DIR}/webapp-dist.zip" .
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --src-path "${CI_PROJECT_DIR}/webapp-dist.zip" --type zip
    - az logout

cd_backend_deploy_azure_webapp:
  stage: deploy_azure
  image: mcr.microsoft.com/azure-cli:latest
  needs:
    - ci_backend_build_and_test
  environment:
    name: production
    url: https://kinkconsentmanagerapi.azurewebsites.net
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_BACKEND_AZURE_DEPLOY == "true"'
      when: manual
    - when: never
  script:
    - apk add --no-cache zip curl
    - cd "${BACKEND_DIR}/publish/api"
    - zip -r "${CI_PROJECT_DIR}/kinkconsentmanager-api.zip" .
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_WEBAPP_NAME" --src-path "${CI_PROJECT_DIR}/kinkconsentmanager-api.zip" --type zip
    - az logout
