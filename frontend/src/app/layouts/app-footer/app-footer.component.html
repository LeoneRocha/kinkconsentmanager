<footer class="app-shell__footer" role="contentinfo">
  <div class="app-shell__footer-inner">
    <p class="app-shell__privacy" [attr.title]="'privacyNotice' | schemaTranslate: 'ui'">
      <i
        class="fa-solid fa-lock"
        [attr.title]="'privacyNotice' | schemaTranslate: 'ui'"
        aria-hidden="true"
      ></i>
      <span>{{ 'privacyNotice' | schemaTranslate: 'ui' }}</span>
    </p>
    <p class="app-shell__meta">
      <span
        [attr.title]="
          currentYear() + ' ' + appName() + ' — ' + ('footerCopyright' | schemaTranslate: 'ui')
        "
      >
        &copy; {{ currentYear() }} {{ appName() }} &middot;
        {{ 'footerCopyright' | schemaTranslate: 'ui' }}
      </span>
      <span class="app-shell__meta-sep" aria-hidden="true">|</span>
      <span
        class="app-shell__version"
        [attr.title]="
          ('footerVersionLabel' | schemaTranslate: 'ui') +
          ' ' +
          appVersion() +
          ' (' +
          ('footerBuildLabel' | schemaTranslate: 'ui') +
          ' ' +
          buildDate() +
          ')'
        "
      >
        {{ 'footerVersionLabel' | schemaTranslate: 'ui' }} {{ appVersion() }} ({{
          'footerBuildLabel' | schemaTranslate: 'ui'
        }}
        {{ buildDate() }})
      </span>
    </p>
  </div>
</footer>
