<div class="checklist-page" [class.checklist-page--classic]="viewMode() === 'classic'">
  @if (isLoading()) {
    <div class="checklist-page__loading" aria-busy="true" [attr.aria-label]="loadingSchemaLabel()">
      <p-skeleton height="8rem" borderRadius="10px" />
      <p-skeleton height="3.5rem" borderRadius="10px" />
      <p-skeleton height="14rem" borderRadius="10px" />
      <p-skeleton height="4rem" borderRadius="10px" />
    </div>
  } @else if (loadError()) {
    <div class="checklist-page__error" role="alert">
      <i class="pi pi-exclamation-circle checklist-page__error-icon" aria-hidden="true"></i>
      <p class="checklist-page__error-text">{{ loadingErrorText() }}</p>
      <p-button
        type="button"
        styleClass="checklist-page__retry-btn"
        icon="pi pi-refresh"
        [label]="retryLabel()"
        (onClick)="loadSchema()"
      />
    </div>
  } @else if (schema(); as activeSchema) {
    @if (resolvedTexts(); as texts) {
      <app-checklist-header
        [currentLang]="i18n.currentLang()"
        [viewMode]="viewMode()"
        [searchQuery]="searchQuery()"
        [onlyUnanswered]="onlyUnanswered()"
        [answeredCount]="answeredCount()"
        [totalCount]="totalCount()"
        [progressPercentage]="progressPercentage()"
        [scales]="activeSchema.scales"
        [scaleLabels]="texts.scales"
        [hasAnswers]="hasAnswers()"
        [labels]="headerLabels()"
        (languageChange)="onLanguageChange($event)"
        (viewModeChange)="onViewModeChange($event)"
        (searchQueryChange)="onSearchQueryChange($event)"
        (onlyUnansweredChange)="onOnlyUnansweredChange($event)"
        (openQuickFill)="onOpenQuickFill()"
        (clearAll)="onClearAll()"
        (goToExport)="onFinishChecklist()"
      />

      <div class="checklist-page__autosave" role="status" aria-live="polite">
        <i
          class="pi"
          [class.pi-spin]="autosave.isSaving()"
          [class.pi-spinner]="autosave.isSaving()"
          [class.pi-lock]="!autosave.isSaving()"
          aria-hidden="true"
        ></i>
        <span>{{ autosaveStatusText() }}</span>
      </div>

      <section
        #contentContainer
        class="checklist-page__content"
        [attr.aria-label]="headerLabels().title"
      >
        @switch (viewMode()) {
          @case ('stepper') {
            <app-checklist-stepper
              [groups]="filteredGroups()"
              [scales]="activeSchema.scales"
              [answers]="answers()"
              [activeStep]="activeStepperStep()"
              [texts]="texts"
              [labels]="stepperLabels()"
              (activeStepChange)="onActiveStepChange($event)"
              (answerChange)="onAnswerChange($event)"
              (readItemAloud)="onReadItemAloud($event)"
              (finishChecklist)="onFinishChecklist()"
            />
          }

          @case ('classic') {
            <app-classic-kink-sheet
              [groups]="filteredGroups()"
              [scales]="activeSchema.scales"
              [answers]="answers()"
              [texts]="texts"
              [noResultsText]="noResultsText()"
              [finishLabel]="finishLabel()"
              [otherPlaceholder]="otherPlaceholder()"
              [readAloudLabel]="readAloudLabel()"
              [classicHint]="classicHint()"
              (answerChange)="onAnswerChange($event)"
              (readItemAloud)="onReadItemAloud($event)"
              (finishChecklist)="onFinishChecklist()"
            />
          }

          @case ('full') {
            <app-full-view-container
              [groups]="filteredGroups()"
              [scales]="activeSchema.scales"
              [answers]="answers()"
              [texts]="texts"
              [noResultsText]="noResultsText()"
              [finishLabel]="finishLabel()"
              [quickNavTitle]="quickNavTitle()"
              [otherPlaceholder]="otherPlaceholder()"
              [readAloudLabel]="readAloudLabel()"
              (answerChange)="onAnswerChange($event)"
              (readItemAloud)="onReadItemAloud($event)"
              (finishChecklist)="onFinishChecklist()"
            />
          }
        }
      </section>

      <app-quick-fill-wizard-modal
        [visible]="quickFillVisible()"
        [groups]="activeSchema.groups"
        [scales]="activeSchema.scales"
        [answers]="answers()"
        [texts]="texts"
        [labels]="quickFillLabels()"
        [readAloudLabel]="readAloudLabel()"
        (visibleChange)="quickFillVisible.set($event)"
        (answerChange)="onAnswerChange($event)"
        (readAloud)="onReadTextAloud($event)"
      />
    }
  }

  <p-confirmdialog />
</div>
