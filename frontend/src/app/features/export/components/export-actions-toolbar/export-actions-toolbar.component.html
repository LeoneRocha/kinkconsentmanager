<nav class="export-toolbar" [attr.aria-label]="'exportStep2Title' | schemaTranslate: 'ui'">
  <div class="export-toolbar__navigation">
    <button
      mat-stroked-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--back"
      data-action="back"
      [attr.title]="backLabel()"
      [attr.aria-label]="backLabel()"
      (click)="onBackClick()"
    >
      <i class="fa-solid fa-arrow-left" [attr.title]="backLabel()" aria-hidden="true"></i>
      <span>{{ backLabel() }}</span>
    </button>
  </div>

  <div class="export-toolbar__actions">
    <button
      mat-flat-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--export"
      [class.export-toolbar__btn--ready]="!exportActionsDisabled()"
      data-action="png"
      [disabled]="exportActionsDisabled()"
      [attr.aria-busy]="busyFormat() === 'png'"
      [attr.title]="pngLabel()"
      [attr.aria-label]="pngLabel()"
      (click)="onExportPngClick()"
    >
      <i
        [class]="busyFormat() === 'png' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-image'"
        [attr.title]="pngLabel()"
        aria-hidden="true"
      ></i>
      <span>{{ pngLabel() }}</span>
    </button>

    <button
      mat-flat-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--export"
      [class.export-toolbar__btn--ready]="!exportActionsDisabled()"
      data-action="pdf"
      [disabled]="exportActionsDisabled()"
      [attr.aria-busy]="busyFormat() === 'pdf'"
      [attr.title]="pdfLabel()"
      [attr.aria-label]="pdfLabel()"
      (click)="onExportPdfClick()"
    >
      <i
        [class]="busyFormat() === 'pdf' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-file-pdf'"
        [attr.title]="pdfLabel()"
        aria-hidden="true"
      ></i>
      <span>{{ pdfLabel() }}</span>
    </button>

    <button
      mat-flat-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--export"
      [class.export-toolbar__btn--ready]="!exportActionsDisabled()"
      data-action="print"
      [disabled]="exportActionsDisabled()"
      [attr.aria-busy]="busyFormat() === 'print'"
      [attr.title]="printLabel()"
      [attr.aria-label]="printLabel()"
      (click)="onPrintClick()"
    >
      <i
        [class]="busyFormat() === 'print' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-print'"
        [attr.title]="printLabel()"
        aria-hidden="true"
      ></i>
      <span>{{ printLabel() }}</span>
    </button>

    <button
      mat-flat-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--export"
      [class.export-toolbar__btn--ready]="!exportActionsDisabled()"
      data-action="json"
      [disabled]="exportActionsDisabled()"
      [attr.aria-busy]="busyFormat() === 'json'"
      [attr.title]="jsonLabel()"
      [attr.aria-label]="jsonLabel()"
      (click)="onExportJsonClick()"
    >
      <i
        [class]="busyFormat() === 'json' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-download'"
        [attr.title]="jsonLabel()"
        aria-hidden="true"
      ></i>
      <span>{{ jsonLabel() }}</span>
    </button>

    <button
      mat-stroked-button
      type="button"
      class="export-toolbar__btn"
      data-action="import-json"
      [disabled]="actionsDisabled()"
      [attr.title]="importJsonLabel()"
      [attr.aria-label]="importJsonLabel()"
      (click)="onImportJsonTriggerClick()"
    >
      <i class="fa-solid fa-upload" [attr.title]="importJsonLabel()" aria-hidden="true"></i>
      <span>{{ importJsonLabel() }}</span>
    </button>

    <button
      mat-flat-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--export"
      [class.export-toolbar__btn--ready]="!exportActionsDisabled()"
      data-action="csv"
      [disabled]="exportActionsDisabled()"
      [attr.aria-busy]="busyFormat() === 'csv'"
      [attr.title]="csvLabel()"
      [attr.aria-label]="csvLabel()"
      (click)="onExportCsvClick()"
    >
      <i
        [class]="busyFormat() === 'csv' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-table'"
        [attr.title]="csvLabel()"
        aria-hidden="true"
      ></i>
      <span>{{ csvLabel() }}</span>
    </button>

    <button
      mat-flat-button
      type="button"
      class="export-toolbar__btn export-toolbar__btn--export"
      [class.export-toolbar__btn--ready]="!exportActionsDisabled()"
      data-action="xlsx"
      [disabled]="exportActionsDisabled()"
      [attr.aria-busy]="busyFormat() === 'xlsx'"
      [attr.title]="xlsxLabel()"
      [attr.aria-label]="xlsxLabel()"
      (click)="onExportXlsxClick()"
    >
      <i
        [class]="busyFormat() === 'xlsx' ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-file-excel'"
        [attr.title]="xlsxLabel()"
        aria-hidden="true"
      ></i>
      <span>{{ xlsxLabel() }}</span>
    </button>

    <input
      #jsonFileInput
      type="file"
      accept=".json,application/json"
      class="export-toolbar__file-input"
      tabindex="-1"
      [attr.aria-label]="importJsonLabel()"
      [attr.title]="importJsonLabel()"
      (change)="onFileSelected($event)"
    />
  </div>
</nav>
