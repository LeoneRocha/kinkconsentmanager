<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KinkConsentManager">
  <defs>
    <linearGradient id="kcm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221230" />
      <stop offset="55%" stop-color="#130b1c" />
      <stop offset="100%" stop-color="#09060e" />
    </linearGradient>
    <linearGradient id="kcm-crimson" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="48%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="kcm-horn" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="52%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#kcm-bg)" stroke="#e11d48" stroke-opacity="0.55" stroke-width="1.5" />

