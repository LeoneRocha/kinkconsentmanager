<div class="progress-indicator">
  <div class="progress-indicator__header">
    <span class="progress-indicator__label" [attr.title]="label()">{{ label() }}</span>
    <span
      class="progress-indicator__stats"
      [attr.title]="answered() + ' / ' + total() + ' (' + clampedPercentage() + '%)'"
    >
      {{ answered() }} / {{ total() }} ({{ clampedPercentage() }}%)
    </span>
  </div>
  <mat-progress-bar
    class="progress-indicator__bar"
    mode="determinate"
    [value]="clampedPercentage()"
    [attr.aria-label]="label()"
    [attr.title]="label() + ': ' + clampedPercentage() + '%'"
  />
</div>
