<header class="checklist-header" [class.checklist-header--collapsed]="!headerExpanded()">
  <div class="checklist-header__top" (click)="toggleHeaderExpanded()">
    <div class="checklist-header__brand">
      <h1 class="checklist-header__title" [attr.title]="labels().title">{{ labels().title }}</h1>
      @if (headerExpanded()) {
        <p class="checklist-header__subtitle" [attr.title]="labels().subtitle">
          {{ labels().subtitle }}
        </p>
      }
    </div>

    <button
      type="button"
      class="checklist-header__toggle-btn"
      [attr.aria-expanded]="headerExpanded()"
      aria-controls="checklist-header-body"
      [attr.aria-label]="toggleHeaderAriaLabel()"
      [attr.title]="toggleHeaderLabel()"
      [matTooltip]="toggleHeaderLabel()"
      matTooltipPosition="left"
      (click)="onToggleButtonClick($event)"
    >
      <i
        class="fa-solid checklist-header__toggle-icon"
        [class.fa-angles-up]="headerExpanded()"
        [class.fa-angles-down]="!headerExpanded()"
        [attr.title]="toggleHeaderLabel()"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  @if (headerExpanded()) {
    <div id="checklist-header-body" class="checklist-header__body">
      <div class="checklist-header__controls-panel">
        <div class="checklist-header__section-title" [attr.title]="controlsSectionTitle()">
          <i
            class="fa-solid fa-sliders"
            [attr.title]="controlsSectionTitle()"
            aria-hidden="true"
          ></i>
          <span>{{ controlsSectionTitle() }}</span>
        </div>

        <div class="checklist-header__controls-row">
          <mat-button-toggle-group
            class="checklist-header__mode-select"
            [hideSingleSelectionIndicator]="true"
            [value]="viewMode()"
            [attr.aria-label]="controlsSectionTitle()"
            (change)="onViewModeModelChange($event.value)"
          >
            @for (opt of viewModeOptions(); track opt.value) {
              <mat-button-toggle [value]="opt.value" [attr.title]="opt.label">
                {{ opt.label }}
              </mat-button-toggle>
            }
          </mat-button-toggle-group>

          <div class="checklist-header__right-controls">
            <div class="checklist-header__filter">
              <mat-slide-toggle
                id="only-unanswered-toggle"
                [checked]="onlyUnanswered()"
                [attr.title]="labels().onlyUnanswered"
                (change)="onOnlyUnansweredModelChange($event.checked)"
              >
                <span class="checklist-header__filter-label" [attr.title]="labels().onlyUnanswered">
                  {{ labels().onlyUnanswered }}
                </span>
              </mat-slide-toggle>
            </div>

            <div class="checklist-header__cta-group">
              <button
                mat-stroked-button
                type="button"
                class="checklist-header__clear-btn"
                [disabled]="!hasAnswers()"
                [attr.title]="labels().clearAll"
                [attr.aria-label]="labels().clearAll"
                (click)="clearAll.emit()"
              >
                <i
                  class="fa-solid fa-trash"
                  [attr.title]="labels().clearAll"
                  aria-hidden="true"
                ></i>
                <span>{{ labels().clearAll }}</span>
              </button>
            </div>
          </div>
        </div>

        <div class="checklist-header__extra">
          <ng-content select="[headerExtra]" />
        </div>
      </div>
    </div>
  }
</header>
