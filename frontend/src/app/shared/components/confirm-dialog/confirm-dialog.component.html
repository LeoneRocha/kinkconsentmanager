<h2 mat-dialog-title class="confirm-dialog__title">
  @if (data.icon) {
    <i
      [class]="data.icon"
      class="confirm-dialog__icon"
      [class.confirm-dialog__icon--danger]="data.danger"
      aria-hidden="true"
    ></i>
  }
  <span>{{ data.header }}</span>
</h2>

<mat-dialog-content class="confirm-dialog__content">
  <p class="confirm-dialog__message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="confirm-dialog__actions">
  <button
    mat-stroked-button
    type="button"
    class="confirm-dialog__reject-btn"
    (click)="onReject()"
  >
    {{ data.rejectLabel }}
  </button>
  <button
    mat-flat-button
    type="button"
    class="confirm-dialog__accept-btn"
    [class.confirm-dialog__accept-btn--danger]="data.danger"
    (click)="onAccept()"
  >
    {{ data.acceptLabel }}
  </button>
</mat-dialog-actions>
