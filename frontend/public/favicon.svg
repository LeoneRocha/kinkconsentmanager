  <circle cx="31" cy="34" r="22" fill="#e11d48" fill-opacity="0.14" />

  <!-- Barbed Devil Tail emerging from the right side of the user silhouette -->
  <path d="M 38.5 47.0 C 45.8 51.0, 52.8 48.2, 54.4 40.4 C 55.4 36.0, 54.6 31.8, 53.8 28.0 C 51.8 28.8, 49.6 29.4, 47.8 29.1 C 50.2 25.0, 52.4 21.4, 54.0 17.2 C 56.2 21.6, 58.2 25.6, 60.0 29.8 C 58.2 29.6, 56.6 28.8, 55.6 27.8 C 57.2 32.4, 58.0 37.4, 56.6 42.8 C 54.0 52.4, 44.8 54.0, 37.0 49.6 Z" fill="url(#kcm-crimson)" />

  <!-- Curved Horns rising from the head -->
