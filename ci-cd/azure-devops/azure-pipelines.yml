# ==============================================================================
# KinkConsentManager (Frontend + Backend) — Pipeline Multiestágio de CI/CD (Azure DevOps)
# ==============================================================================
# ESTADO ATUAL: CI AUTOMÁTICO ATIVO NA BRANCH `main` (CD / DOCKER DESATIVADOS POR PADRÃO)
# - `trigger` dispara automaticamente o estágio de CI em commits para `main`
#   que alterem `frontend/**`, `backend/**` ou `ci-cd/**` (ignorando `docs/**` e `**/*.md`).
# - Os estágios de CD (Docker Frontend, Docker Backend e Azure Deploy) e os scans opcionais
#   (SonarCloud e Snyk) ficam desativados por padrão (`false`) via parâmetros e variáveis
#   da pipeline, protegidos por branch `refs/heads/main` e Environment `production`.
#
# COMO CONFIGURAR:
# 1. Cadastre este arquivo no Azure DevOps Pipelines apontando para:
#    `ci-cd/azure-devops/azure-pipelines.yml`
# 2. Configure o Variable Group `kinkconsentmanager-ci-vars` (ou variáveis de pipeline)
#    e as Service Connections descritas em `ci-cd/README.md`.
# 3. Crie o Environment `production` no Azure DevOps com:
#    - Approvals and checks -> Approvals (aprovadores obrigatórios)
#    - Approvals and checks -> Branch control -> `refs/heads/main`
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**
      - backend/**
      - ci-cd/**
    exclude:
      - docs/**
      - '**/*.md'

pr: none

parameters:
  - name: nodeVersion
    displayName: 'Versão do Node.js (Frontend)'
    type: string
    default: '24.x'

  - name: dotnetVersion
    displayName: 'Versão do .NET SDK (Backend)'
    type: string
    default: '10.0.x'

  - name: useLegacyPeerDeps
    displayName: 'Usar --legacy-peer-deps no npm ci'
    type: boolean
    default: true

  - name: enableSonarCloud
    displayName: 'Executar análise e Quality Gate no SonarCloud'
    type: boolean
    default: false

  - name: enableSnykScan
    displayName: 'Executar Snyk Security Scan (requer extensão/conexão Snyk)'
    type: boolean
    default: false

  - name: enableDockerPublish
    displayName: 'Executar estágio CD — Build & Push da imagem Docker Frontend (somente main)'
    type: boolean
    default: false

  - name: enableBackendDockerPublish
    displayName: 'Executar estágio CD — Build & Push da imagem Docker Backend (somente main)'
    type: boolean
    default: false

  - name: enableAzureDeploy
    displayName: 'Executar estágio CD — Deploy no Azure Web App com aprovação (somente main)'
    type: boolean
    default: false

  - name: enableBackendAzureDeploy
    displayName: 'Executar estágio CD — Deploy ZIP da API Backend no Azure Web App com aprovação (somente main)'
    type: boolean
    default: false

variables:
  # Defaults sobrescrevíveis via Variable Group `kinkconsentmanager-ci-vars` ou Variáveis da Pipeline:
  - name: sonarOrganization
    value: 'lionscorp'
  - name: azureWebAppName
    value: 'kinkconsentmanagerapp'
  - name: azureStartupCommand
    value: 'pm2 serve /home/site/wwwroot --no-daemon --spa'
  - name: azureBackendWebAppName
    value: 'kinkconsentmanagerapi'
  - name: azureBackendStartupCommand
    value: 'dotnet KinkConsentManager.API.dll'
  - name: dockerImageRepository
    value: 'leonecr/kinkconsentmanager-ui'
  - name: backendDockerImageRepository
    value: 'leonecr/kinkconsentmanager-api'
  - name: frontendDir
    value: '$(Build.SourcesDirectory)/frontend'
  - name: distBrowserDir
    value: '$(Build.SourcesDirectory)/frontend/dist/kinkconsentmanager/browser'
  - name: backendDir
    value: '$(Build.SourcesDirectory)/backend'
  - name: backendSln
    value: '$(Build.SourcesDirectory)/backend/KinkConsentManager.sln'
  - name: backendApiProject
    value: '$(Build.SourcesDirectory)/backend/APIs/KinkConsentManager.API/KinkConsentManager.API.csproj'
  - name: npmCacheFolder
    value: '$(Pipeline.Workspace)/.npm'
  - name: nugetCacheFolder
    value: '$(Pipeline.Workspace)/.nuget/packages'
  - group: kinkconsentmanager-ci-vars
  # Precedência final (ambiente prevalece se existir):
  # Variável cadastrada em `kinkconsentmanager-ci-vars`/Pipeline UI -> Parâmetro no Run -> Default do parâmetro
  - name: resolvedNodeVersion
    value: $[ coalesce(variables['nodeVersion'], '${{ parameters.nodeVersion }}') ]
  - name: resolvedDotnetVersion
    value: $[ coalesce(variables['dotnetVersion'], '${{ parameters.dotnetVersion }}') ]
  - name: resolvedUseLegacyPeerDeps
    value: $[ coalesce(variables['useLegacyPeerDeps'], '${{ parameters.useLegacyPeerDeps }}') ]
  - name: resolvedEnableSonarCloud
    value: $[ coalesce(variables['enableSonarCloud'], '${{ parameters.enableSonarCloud }}') ]
  - name: resolvedEnableSnykScan
    value: $[ coalesce(variables['enableSnykScan'], '${{ parameters.enableSnykScan }}') ]
  - name: resolvedEnableDockerPublish
    value: $[ coalesce(variables['enableDockerPublish'], '${{ parameters.enableDockerPublish }}') ]
  - name: resolvedEnableBackendDockerPublish
    value: $[ coalesce(variables['enableBackendDockerPublish'], '${{ parameters.enableBackendDockerPublish }}') ]
  - name: resolvedEnableAzureDeploy
    value: $[ coalesce(variables['enableAzureDeploy'], '${{ parameters.enableAzureDeploy }}') ]
  - name: resolvedEnableBackendAzureDeploy
    value: $[ coalesce(variables['enableBackendAzureDeploy'], '${{ parameters.enableBackendAzureDeploy }}') ]

stages:
  # ============================================================================
  # ESTÁGIO 1 — CI: Build, Segurança, Testes e Cobertura (Frontend & Backend)
  # ============================================================================
  - stage: CI_Build_Quality
    displayName: 'CI — Build, Testes, Cobertura & SonarCloud'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: BuildAndTestFrontend
        displayName: 'Build Angular 22, Jest & SonarCloud'
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true
            displayName: 'Checkout completo (fetchDepth: 0 para SonarCloud)'

          - task: NodeTool@0
            displayName: 'Instalar Node.js'
            inputs:
              versionSpec: '$(resolvedNodeVersion)'

          - task: Cache@2
            displayName: 'Cache de pacotes npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(npmCacheFolder)'

          - task: Npm@1
            displayName: 'npm ci --legacy-peer-deps (instalação determinística em frontend/)'
            condition: and(succeeded(), eq(variables['resolvedUseLegacyPeerDeps'], 'true'))
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'ci --legacy-peer-deps'
            env:
              NPM_CONFIG_CACHE: '$(npmCacheFolder)'
              NPM_CONFIG_PREFER_OFFLINE: 'true'

          - task: Npm@1
            displayName: 'npm ci (instalação determinística em frontend/)'
            condition: and(succeeded(), ne(variables['resolvedUseLegacyPeerDeps'], 'true'))
            inputs:
              command: 'ci'
              workingDir: '$(frontendDir)'
            env:
              NPM_CONFIG_CACHE: '$(npmCacheFolder)'
              NPM_CONFIG_PREFER_OFFLINE: 'true'

          - task: Npm@1
            displayName: 'Auditoria de dependências npm (aviso high/critical)'
            continueOnError: true
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'audit --audit-level=high --omit=dev'

          - task: SnykSecurityScan@1
            displayName: 'Snyk Scan de vulnerabilidades Open Source'
            condition: and(succeeded(), eq(variables['resolvedEnableSnykScan'], 'true'))
            inputs:
              serviceConnectionEndpoint: '$(snykServiceConnection)'
              testType: 'app'
              targetFile: '$(frontendDir)/package.json'
              additionalArguments: '--severity-threshold=high'
              failOnIssues: false

          - task: Npm@1
            displayName: 'Build de produção Angular (build:prod)'
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'run build:prod'
            env:
              BUILD_ID: '$(Build.BuildId)'

          - task: Npm@1
            displayName: 'Testes unitários e cobertura Jest (test:ci)'
            inputs:
              command: 'custom'
              workingDir: '$(frontendDir)'
              customCommand: 'run test:ci'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados JUnit dos testes Jest'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'frontend/coverage/junit/test-results.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: 'Jest Unit Tests — KinkConsentManager UI'
              failTaskOnFailedTests: true

          - task: ReportGenerator@5
            displayName: 'Gerar relatório consolidado de cobertura (Cobertura + HTML)'
            condition: succeeded()
            inputs:
              reports: '$(frontendDir)/coverage/cobertura-coverage.xml'
              targetdir: '$(frontendDir)/coverage/reportgenerator'
              reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura no Azure Pipelines (Cobertura XML)'
            condition: succeeded()
            inputs:
              summaryFileLocation: '$(frontendDir)/coverage/cobertura-coverage.xml'
              pathToSources: '$(frontendDir)/src'
              failIfCoverageEmpty: true

          - task: SonarCloudPrepare@3
            displayName: 'SonarCloud — Preparar análise (CLI)'
            condition: and(succeeded(), eq(variables['resolvedEnableSonarCloud'], 'true'))
            inputs:
              SonarCloud: '$(sonarCloudServiceConnection)'
              organization: '$(sonarOrganization)'
              scannerMode: 'CLI'
              configMode: 'file'
              configFile: 'frontend/sonar-project.properties'

          - task: SonarCloudAnalyze@3
            displayName: 'SonarCloud — Executar análise de código e cobertura'
            condition: and(succeeded(), eq(variables['resolvedEnableSonarCloud'], 'true'))

          - task: SonarCloudPublish@3
            displayName: 'SonarCloud — Publicar Quality Gate'
            condition: and(succeeded(), eq(variables['resolvedEnableSonarCloud'], 'true'))
            inputs:
              pollingTimeoutSec: '300'

          - task: CmdLine@2
            displayName: 'Validar saída SPA em dist/kinkconsentmanager/browser'
            condition: succeeded()
            inputs:
              script: |
                test -f "$(distBrowserDir)/index.html" || { echo "ERRO: index.html não encontrado em $(distBrowserDir)"; exit 1; }
                ls -lh "$(distBrowserDir)"

          - task: ArchiveFiles@2
            displayName: 'Compactar pacote SPA para Azure Web App (.zip)'
            condition: succeeded()
            inputs:
              rootFolderOrFile: '$(distBrowserDir)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/webapp/kinkconsentmanager-ui-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: CopyFiles@2
            displayName: 'Copiar dockercompose.prod.yml para artefato'
            condition: succeeded()
            inputs:
              SourceFolder: '$(frontendDir)'
              Contents: 'dockercompose.prod.yml'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/docker-compose'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato WebApp (drop-webapp)'
            condition: succeeded()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/webapp'
              artifact: 'drop-webapp'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato Docker Compose (drop-docker-compose)'
            condition: succeeded()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/docker-compose'
              artifact: 'drop-docker-compose'
              publishLocation: 'pipeline'

          - task: CmdLine@2
            name: ResolveCdFlags
            displayName: 'Exibir configuração efetiva e propagar flags para CD (Frontend)'
            condition: succeeded()
            inputs:
              script: |
                echo "nodeVersion=$(resolvedNodeVersion)"
                echo "useLegacyPeerDeps=$(resolvedUseLegacyPeerDeps)"
                echo "enableSonarCloud=$(resolvedEnableSonarCloud)"
                echo "enableSnykScan=$(resolvedEnableSnykScan)"
                echo "enableDockerPublish=$(resolvedEnableDockerPublish)"
                echo "enableAzureDeploy=$(resolvedEnableAzureDeploy)"
                echo "##vso[task.setvariable variable=enableDockerPublish;isOutput=true]$(resolvedEnableDockerPublish)"
                echo "##vso[task.setvariable variable=enableAzureDeploy;isOutput=true]$(resolvedEnableAzureDeploy)"

      - job: BuildAndTestBackend
        displayName: 'Build .NET 10, Testes NUnit & Cobertura (Backend)'
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true
            displayName: 'Checkout completo do repositório'

          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK $(resolvedDotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(resolvedDotnetVersion)'

          - task: Cache@2
            displayName: 'Cache de pacotes NuGet'
            inputs:
              key: 'nuget | "$(Agent.OS)" | backend/Directory.Packages.props'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: '$(nugetCacheFolder)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore da Solution Backend (KinkConsentManager.sln)'
            inputs:
              command: 'restore'
              projects: '$(backendSln)'
            env:
              NUGET_PACKAGES: '$(nugetCacheFolder)'

          - task: DotNetCoreCLI@2
            displayName: 'Build Release da Solution Backend'
            inputs:
              command: 'build'
              projects: '$(backendSln)'
              arguments: '-c Release --no-restore'
            env:
              NUGET_PACKAGES: '$(nugetCacheFolder)'

          - task: DotNetCoreCLI@2
            displayName: 'Executar testes NUnit e cobertura do Backend'
            inputs:
              command: 'test'
              projects: '$(backendSln)'
              arguments: '-c Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory "$(Agent.TempDirectory)/backend-test-results" --collect:"XPlat Code Coverage"'
              publishTestResults: false

          - task: PublishTestResults@2
            displayName: 'Publicar resultados TRX dos testes NUnit (Backend)'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(Agent.TempDirectory)/backend-test-results'
              testRunTitle: 'NUnit Tests — KinkConsentManager Backend'
              failTaskOnFailedTests: true

          - task: ReportGenerator@5
            displayName: 'Gerar relatório consolidado de cobertura Backend (Cobertura + HTML)'
            condition: succeeded()
            inputs:
              reports: '$(Agent.TempDirectory)/backend-test-results/**/coverage.cobertura.xml'
              targetdir: '$(Agent.TempDirectory)/backend-coverage-report'
              reporttypes: 'HtmlInline_AzurePipelines;Cobertura'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura do Backend no Azure Pipelines'
            condition: succeeded()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/backend-coverage-report/Cobertura.xml'
              pathToSources: '$(backendDir)'
              failIfCoverageEmpty: true

          - task: DotNetCoreCLI@2
            displayName: 'Publish Release da API Backend (portável /p:UseAppHost=false)'
            condition: succeeded()
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(backendApiProject)'
              arguments: '-c Release --no-build /p:UseAppHost=false -o "$(Build.ArtifactStagingDirectory)/backend-api-publish"'
              zipAfterPublish: false
            env:
              NUGET_PACKAGES: '$(nugetCacheFolder)'

          - task: CmdLine@2
            displayName: 'Validar saída publicada da API Backend (KinkConsentManager.API.dll)'
            condition: succeeded()
            inputs:
              script: |
                test -f "$(Build.ArtifactStagingDirectory)/backend-api-publish/KinkConsentManager.API.dll" || { echo "ERRO: KinkConsentManager.API.dll não encontrado"; exit 1; }
                ls -lh "$(Build.ArtifactStagingDirectory)/backend-api-publish"

          - task: ArchiveFiles@2
            displayName: 'Compactar pacote tradicional da API Backend (.zip)'
            condition: succeeded()
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/backend-api-publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend-api/kinkconsentmanager-api-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: CopyFiles@2
            displayName: 'Copiar docker-compose.prod.yml do Backend para artefato'
            condition: succeeded()
            inputs:
              SourceFolder: '$(backendDir)/APIs/KinkConsentManager.API'
              Contents: 'docker-compose.prod.yml'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/backend-docker-compose'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar pacote ZIP tradicional da API Backend (drop-backend-api)'
            condition: succeeded()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend-api'
              artifact: 'drop-backend-api'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato Docker Compose Backend (drop-backend-docker-compose)'
            condition: succeeded()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend-docker-compose'
              artifact: 'drop-backend-docker-compose'
              publishLocation: 'pipeline'

          - task: CmdLine@2
            name: ResolveBackendCdFlags
            displayName: 'Exibir configuração efetiva e propagar flags para CD (Backend)'
            condition: succeeded()
            inputs:
              script: |
                echo "dotnetVersion=$(resolvedDotnetVersion)"
                echo "enableBackendDockerPublish=$(resolvedEnableBackendDockerPublish)"
                echo "enableBackendAzureDeploy=$(resolvedEnableBackendAzureDeploy)"
                echo "##vso[task.setvariable variable=enableBackendDockerPublish;isOutput=true]$(resolvedEnableBackendDockerPublish)"
                echo "##vso[task.setvariable variable=enableBackendAzureDeploy;isOutput=true]$(resolvedEnableBackendAzureDeploy)"

  # ============================================================================
  # ESTÁGIO 2A — CD Frontend: Build, Smoke Test e Push da Imagem Docker (desativado por padrão)
  # ============================================================================
  - stage: CD_Docker_Image
    displayName: 'CD Frontend — Build, Smoke Test & Push Docker Image'
    dependsOn: CI_Build_Quality
    condition: |
      and(
        succeeded(),
        eq(dependencies.CI_Build_Quality.outputs['BuildAndTestFrontend.ResolveCdFlags.enableDockerPublish'], 'true'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: BuildAndPushDocker
        displayName: 'Docker Build (Nginx SPA), Healthcheck & Push'
        steps:
          - checkout: self
            clean: true

          - task: Docker@2
            displayName: 'Docker Build da imagem $(dockerImageRepository)'
            inputs:
              command: 'build'
              Dockerfile: '$(frontendDir)/Dockerfile'
              buildContext: '$(frontendDir)'
              repository: '$(dockerImageRepository)'
              arguments: '--build-arg BUILD_ID=$(Build.BuildId)'
              tags: |
                $(Build.BuildId)
                latest

          - task: CmdLine@2
            displayName: 'Smoke test do container Nginx (/health e SPA)'
            inputs:
              script: |
                set -euo pipefail
                docker run -d --name kcm-smoke -p 18080:80 "$(dockerImageRepository):$(Build.BuildId)"
                trap 'docker rm -f kcm-smoke >/dev/null 2>&1 || true' EXIT
                sleep 3
                curl -fsS http://127.0.0.1:18080/health
                curl -fsS -o /dev/null http://127.0.0.1:18080/

          - task: Docker@2
            displayName: 'Docker Push para Container Registry'
            inputs:
              command: 'push'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(dockerImageRepository)'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================================================
  # ESTÁGIO 2B — CD Backend: Build, Smoke Test e Push da Imagem Docker (desativado por padrão)
  # ============================================================================
  - stage: CD_Docker_Image_Backend
    displayName: 'CD Backend — Build, Smoke Test & Push Docker Image'
    dependsOn: CI_Build_Quality
    condition: |
      and(
        succeeded(),
        eq(dependencies.CI_Build_Quality.outputs['BuildAndTestBackend.ResolveBackendCdFlags.enableBackendDockerPublish'], 'true'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: BuildAndPushBackendDocker
        displayName: 'Docker Build (.NET 10 API), Healthcheck & Push'
        steps:
          - checkout: self
            clean: true

          - task: Docker@2
            displayName: 'Docker Build da imagem $(backendDockerImageRepository)'
            inputs:
              command: 'build'
              Dockerfile: '$(backendDir)/APIs/KinkConsentManager.API/Dockerfile'
              buildContext: '$(backendDir)'
              repository: '$(backendDockerImageRepository)'
              tags: |
                $(Build.BuildId)
                latest

          - task: CmdLine@2
            displayName: 'Smoke test do container Backend (/health)'
            inputs:
              script: |
                set -euo pipefail
                docker run -d --name kcm-api-smoke -p 18081:8080 \
                  -e ASPNETCORE_ENVIRONMENT=Development \
                  -e DatabaseProvider=InMemory \
                  -e Database__SkipInitialization=true \
                  -e TokenConfigurations__Secret=KinkConsentManagerCiSmokeTestSecretKeyOnlyForValidation2026_1234567890 \
                  "$(backendDockerImageRepository):$(Build.BuildId)"
                trap 'docker rm -f kcm-api-smoke >/dev/null 2>&1 || true' EXIT
                for attempt in $(seq 1 15); do
                  if curl -fsS http://127.0.0.1:18081/health; then
                    exit 0
                  fi
                  sleep 2
                done
                docker logs kcm-api-smoke || true
                exit 1

          - task: Docker@2
            displayName: 'Docker Push Backend para Container Registry'
            inputs:
              command: 'push'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(backendDockerImageRepository)'
              tags: |
                $(Build.BuildId)
                latest

  # ============================================================================
  # ESTÁGIO 3 — CD: Deploy no Azure Web App Linux (Aprovação + Branch main)
  # ============================================================================
  - stage: CD_Deploy_Azure
    displayName: 'CD — Deploy Azure Web App (com Aprovação)'
    dependsOn: CI_Build_Quality
    condition: |
      and(
        succeeded(),
        eq(dependencies.CI_Build_Quality.outputs['BuildAndTestFrontend.ResolveCdFlags.enableAzureDeploy'], 'true'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - deployment: DeployAzureWebApp
        displayName: 'Deploy SPA para Azure Web App ($(azureWebAppName))'
        # Configurar no Environment `production` do Azure DevOps:
        # 1) Approvals -> Aprovadores obrigatórios antes do deploy
        # 2) Branch control -> Permitir apenas refs/heads/main
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'drop-webapp'
                  displayName: 'Baixar pacote ZIP do frontend'

                - task: AzureWebApp@1
                  displayName: 'Deploy no Azure Web App Linux ($(azureWebAppName))'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(azureWebAppName)'
                    package: '$(Pipeline.Workspace)/drop-webapp/kinkconsentmanager-ui-$(Build.BuildId).zip'
                    runtimeStack: 'NODE|24-lts'
                    startUpCommand: '$(azureStartupCommand)'

                - task: CmdLine@2
                  displayName: 'Smoke test pós-deploy HTTPS'
                  continueOnError: true
                  inputs:
                    script: |
                      URL="${AZURE_WEBAPP_URL:-https://$(azureWebAppName).azurewebsites.net}"
                      echo "Verificando disponibilidade em $URL ..."
                      curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$URL"

  # ============================================================================
  # ESTÁGIO 3B — CD Backend: Deploy ZIP Tradicional no Azure Web App Linux (desativado por padrão)
  # ============================================================================
  - stage: CD_Deploy_Azure_Backend
    displayName: 'CD Backend — Deploy ZIP Azure Web App (com Aprovação)'
    dependsOn: CI_Build_Quality
    condition: |
      and(
        succeeded(),
        eq(dependencies.CI_Build_Quality.outputs['BuildAndTestBackend.ResolveBackendCdFlags.enableBackendAzureDeploy'], 'true'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - deployment: DeployAzureBackendWebApp
        displayName: 'Deploy ZIP da API para Azure Web App ($(azureBackendWebAppName))'
        # Configurar no Environment `production` do Azure DevOps:
        # 1) Approvals -> Aprovadores obrigatórios antes do deploy
        # 2) Branch control -> Permitir apenas refs/heads/main
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'drop-backend-api'
                  displayName: 'Baixar pacote ZIP da API Backend'

                - task: AzureWebApp@1
                  displayName: 'Deploy da API no Azure Web App Linux ($(azureBackendWebAppName))'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(azureBackendWebAppName)'
                    package: '$(Pipeline.Workspace)/drop-backend-api/kinkconsentmanager-api-$(Build.BuildId).zip'
                    runtimeStack: 'DOTNETCORE|10.0'
                    startUpCommand: '$(azureBackendStartupCommand)'

                - task: CmdLine@2
                  displayName: 'Smoke test pós-deploy HTTPS (/health)'
                  continueOnError: true
                  inputs:
                    script: |
                      URL="${AZURE_BACKEND_WEBAPP_URL:-https://$(azureBackendWebAppName).azurewebsites.net}"
                      echo "Verificando disponibilidade em $URL/health ..."
                      curl -fsS --retry 3 --retry-delay 5 "$URL/health"
