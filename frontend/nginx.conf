# ==============================================================================
# KinkConsentManager — Configuracao Nginx de Producao (SPA Angular 22 + PrimeNG)
# ==============================================================================
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  # Oculta versao do Nginx nas respostas de erro e headers
  server_tokens off;

  access_log /dev/stdout combined;

  # Otimizacoes de I/O e cache de descritores de arquivo
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 2m;

  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Compressao Gzip otimizada para bundles Angular, JSONs (schemas/i18n) e fontes
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml
    image/x-icon
    font/ttf
    font/woff
    font/woff2
    application/vnd.ms-fontobject;

  server {
    # Portas para producao (80), dev/preview (4200) e docker-compose local (8082) - IPv4 e IPv6
    listen 80;
    listen [::]:80;
    listen 4200;
    listen [::]:4200;
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Nota Nginx: blocos `location` que declaram `add_header` nao herdam
    # `add_header` do bloco `server`, portanto os headers de seguranca sao
    # replicados nos `location` que definem politica de Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;

    # Endpoint de health check para Azure App Service, Docker Healthcheck e Kubernetes Probes
    location = /health {
      access_log off;
      add_header Content-Type "text/plain; charset=utf-8" always;
      add_header Cache-Control "no-store" always;
      return 200 "healthy\n";
    }

    # Bloqueia acesso a arquivos ocultos (ex.: .git, .env), exceto .well-known
    location ~ /\.(?!well-known) {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Entrypoint da SPA: nunca armazenar em cache para garantir atualizacao imediata de hashes
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
    }

    # Schemas JSON e traducoes i18n (precedencia garantida com ^~ sobre regex de estaticos)
    location ^~ /assets/ {
      add_header Cache-Control "no-cache, must-revalidate" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
      try_files $uri =404;
    }

    # Bundles JS/CSS/fontes/midia com hash de conteudo gerado pelo Angular (`outputHashing: all`)
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|ico|webmanifest)$ {
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
      try_files $uri =404;
    }

    # Preparado para V2+: Proxy reverso para API Node.js (descomentar quando o backend existir)
    # location /api/ {
    #   proxy_pass http://backend-container:3000;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Roteamento SPA (Angular Router: /checklist, /export)
    location / {
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
