<div class="scale-selector" [class.scale-selector--compact]="compact()">
  @if (roleTitle().trim().length > 0) {
  <span class="scale-selector__role" [attr.title]="roleTitle()">{{ roleTitle() }}</span>
  }

  <div class="scale-selector__group" role="radiogroup" [attr.aria-label]="roleTitle()"
    [attr.aria-disabled]="disabled() ? 'true' : null">
    @for (scale of orderedScales(); track scale.id; let idx = $index) {
    @let scaleVal = getScaleValue(scale);
    <button #scaleBtn type="button" role="radio" class="scale-selector__btn"
      [class.scale-selector__btn--selected]="isSelected(scale)" [disabled]="disabled()"
      [attr.aria-checked]="isSelected(scale)" [attr.aria-label]="getScaleLabel(scale)"
      [attr.title]="getScaleLabel(scale)" [attr.tabindex]="focusableScaleId() === scaleVal ? 0 : -1"
      [style.background-color]="isSelected(scale) ? scale.color : null" [style.border-color]="scale.color"
      [style.color]="isSelected(scale) ? scale.contrastColor : null" (click)="onSelect(scale)"
      (keydown)="onKeydown($event, idx)">
      <i [class]="scale.icon" class="scale-selector__icon" [attr.title]="getScaleLabel(scale)" aria-hidden="true"></i>
    </button>
    }
  </div>
</div>
