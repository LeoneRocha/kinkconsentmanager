<header class="checklist-header" [class.checklist-header--collapsed]="!headerExpanded()">
  <div class="checklist-header__top">
    <div class="checklist-header__brand">
      <h1 class="checklist-header__title">{{ labels().title }}</h1>
      @if (headerExpanded()) {
      <p class="checklist-header__subtitle">{{ labels().subtitle }}</p>
      }
    </div>

    <div class="checklist-header__toggle-wrap">
      <button mat-stroked-button type="button" class="checklist-header__toggle-btn"
        [attr.aria-expanded]="headerExpanded()" aria-controls="checklist-header-body"
        [attr.aria-label]="toggleHeaderAriaLabel()" (click)="toggleHeaderExpanded()">
        <i class="fa-solid" [class.fa-chevron-up]="headerExpanded()" [class.fa-chevron-down]="!headerExpanded()"
          aria-hidden="true"></i>
        <span>{{ toggleHeaderLabel() }}</span>
      </button>
    </div>
  </div>

  @if (headerExpanded()) {
  <div id="checklist-header-body" class="checklist-header__body">
    <div class="checklist-header__controls-panel">
      <div class="checklist-header__section-title">
        <i class="fa-solid fa-sliders" aria-hidden="true"></i>
        <span>{{ controlsSectionTitle() }}</span>
      </div>

      <div class="checklist-header__controls-row">
        <mat-button-toggle-group class="checklist-header__mode-select" [hideSingleSelectionIndicator]="true"
          [value]="viewMode()" (change)="onViewModeModelChange($event.value)">
          @for (opt of viewModeOptions(); track opt.value) {
          <mat-button-toggle [value]="opt.value">{{ opt.label }}</mat-button-toggle>
          }
        </mat-button-toggle-group>

        <div class="checklist-header__right-controls">
          <div class="checklist-header__filter">
            <mat-slide-toggle id="only-unanswered-toggle" [checked]="onlyUnanswered()"
              (change)="onOnlyUnansweredModelChange($event.checked)">
              <span class="checklist-header__filter-label">{{ labels().onlyUnanswered }}</span>
            </mat-slide-toggle>
          </div>

          <div class="checklist-header__cta-group">
            <button mat-stroked-button type="button" class="checklist-header__clear-btn" [disabled]="!hasAnswers()"
              (click)="clearAll.emit()">
              <i class="fa-solid fa-trash" aria-hidden="true"></i>
              <span>{{ labels().clearAll }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="checklist-header__top-actions">
      <div class="checklist-header__save-box">
        <div class="checklist-header__save-actions">
          <button mat-flat-button type="button" class="checklist-header__save-btn"
            [class.checklist-header__save-btn--dirty]="hasUnsavedChanges()"
            [disabled]="isAutosaving() || !hasUnsavedChanges()" [matTooltip]="saveNowTooltip()"
            matTooltipPosition="below" (click)="saveNow.emit()">
            <i class="fa-solid" [class.fa-spin]="isAutosaving()" [class.fa-spinner]="isAutosaving()"
              [class.fa-floppy-disk]="!isAutosaving()" aria-hidden="true"></i>
            <span>{{ saveButtonLabel() }}</span>
          </button>

          <button mat-flat-button type="button" class="checklist-header__export-btn"
            [class.checklist-header__export-btn--ready]="isChecklistComplete()" [disabled]="!isChecklistComplete()"
            (click)="goToExport.emit()">
            <i class="fa-solid fa-file-export" aria-hidden="true"></i>
            <span>{{ labels().exportButton }}</span>
          </button>
        </div>

        <div class="checklist-header__autosave-row">
          <mat-slide-toggle class="checklist-header__autosave-toggle" [checked]="autosaveEnabled()"
            (change)="onAutosaveEnabledModelChange($event.checked)">
            {{ autosaveToggleLabel() }}
          </mat-slide-toggle>

          <span class="checklist-header__save-meta" role="status" aria-live="polite">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <span>{{ autosaveText() }}</span>
          </span>
        </div>
      </div>
    </div>
  </div>
  }
</header>
