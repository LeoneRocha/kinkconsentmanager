@if (svgDefinition(); as def) {
  <svg
    [class]="wrapperClasses()"
    [attr.viewBox]="svgViewBox()"
    [attr.data-icon]="def.iconName"
    [attr.data-prefix]="def.prefix"
    [attr.title]="effectiveTitle() || null"
    [attr.aria-hidden]="hasAccessibleLabel() ? null : 'true'"
    [attr.role]="hasAccessibleLabel() ? 'img' : null"
    [attr.aria-label]="effectiveTitle() || null"
    focusable="false"
  >
    @if (effectiveTitle(); as iconTitle) {
      <title>{{ iconTitle }}</title>
    }
    @for (d of svgPaths(); track $index) {
      <path [attr.d]="d" />
    }
  </svg>
} @else {
  <i
    [class]="wrapperClasses() + ' ' + cssIconClasses()"
    [attr.title]="effectiveTitle() || null"
    [attr.aria-hidden]="hasAccessibleLabel() ? null : 'true'"
    [attr.role]="hasAccessibleLabel() ? 'img' : null"
    [attr.aria-label]="effectiveTitle() || null"
  ></i>
}
