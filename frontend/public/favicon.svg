  <path d="M 33.6 18.2 C 40.0 15.2, 42.4 9.8, 37.2 6.4 C 38.4 10.4, 36.4 13.8, 31.0 16.2 Z" fill="url(#kcm-horn)" />

  <!-- Stylized User Silhouette (Head + Shoulders/Torso) -->
