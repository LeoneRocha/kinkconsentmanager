<header class="app-shell__topbar" role="banner">
  <div class="app-shell__topbar-inner">
    <a
      class="app-shell__brand"
      [routerLink]="dashboardRoute"
      [attr.aria-label]="
        ('title' | schemaTranslate: 'ui') + ' — ' + ('navDashboard' | schemaTranslate: 'ui')
      "
      [attr.title]="
        ('title' | schemaTranslate: 'ui') + ' — ' + ('navDashboard' | schemaTranslate: 'ui')
      "
      (click)="onNavigateToDashboard($event)"
    >
      <span class="app-shell__brand-badge">
        <img
          src="favicon.svg"
          [attr.alt]="'title' | schemaTranslate: 'ui'"
          [attr.title]="'title' | schemaTranslate: 'ui'"
          class="app-shell__brand-icon"
          width="36"
          height="36"
        />
      </span>
      <span
        class="app-shell__brand-title"
        [attr.title]="
          ('title' | schemaTranslate: 'ui') + ' — ' + ('navDashboard' | schemaTranslate: 'ui')
        "
      >
        {{ 'title' | schemaTranslate: 'ui' }}
      </span>
    </a>

    <app-header-utilities />
  </div>
</header>
